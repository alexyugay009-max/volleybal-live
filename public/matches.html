<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Матчи — Volleyball Live</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
  <a class="logo" href="/">🏐 VOLLEYBALL <span>LIVE</span></a>
  <nav>
    <a href="/">Главная</a>
    <a class="active" href="/matches.html">Матчи</a>
    <a href="/live.html">LIVE</a>
    <a href="/players.html">Игроки</a>
  </nav>
</header>
<main>
  <section class="page-title">
    <span class="eyebrow">РАСПИСАНИЕ И РЕЗУЛЬТАТЫ</span>
    <h1>Матчи</h1>
    <p>Выбери дату. Прошедшие матчи показываются с результатом, будущие — со временем начала.</p>
  </section>

  <div class="date-tools">
    <button class="button ghost" id="prevDay">← День</button>
    <input id="datePicker" type="date">
    <button class="button ghost" id="nextDay">День →</button>
  </div>

  <div class="legend">
    <span><i class="dot live"></i> LIVE</span>
    <span><i class="dot"></i> Предстоящий</span>
    <span><i class="dot done"></i> Завершён</span>
  </div>

  <div id="matches" class="match-list big"></div>
</main>
<footer>© 2026 Volleyball Live</footer>
<script src="/js/matches.js"></script>
</body>
</html>
